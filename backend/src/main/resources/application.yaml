spring:
  application:
    name: regulation-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:regulation-backend}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  data-import:
    laptops-enabled: ${LAPTOP_IMPORT_ENABLED:false}
    max-products: ${LAPTOP_IMPORT_MAX_PRODUCTS:20}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:https://api-production-b778.up.railway.app}

ai:
  embedding-enabled: ${AI_EMBEDDING_ENABLED:true}
  embedding-base-url: ${AI_EMBEDDING_BASE_URL:https://api-production-b778.up.railway.app/v1}
  embedding-model: ${AI_EMBEDDING_MODEL:all-MiniLM-L6-v2}
  embedding-dimensions: 384
  timeout-seconds: ${AI_EMBEDDING_TIMEOUT:60}
  key-spec-labels:
    - Loại CPU
    - Dung lượng RAM
    - Loại card đồ họa
    - Kích thước màn hình
    - Ổ cứng
