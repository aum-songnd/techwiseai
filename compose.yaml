services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: regulation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    volumes:
      - regulation_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: techwiseai-recommendation-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-regulation_db}
      DB_USER: ${POSTGRES_USER:-regulation_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-regulation_password}
      EMBEDDING_API_URL: https://api-production-b778.up.railway.app/v1
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  regulation_postgres_data: