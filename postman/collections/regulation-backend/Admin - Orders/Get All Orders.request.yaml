$kind: http-request
name: Get All Orders
order: 1000
method: GET
url: '{{baseUrl}}/api/v1/admin/orders'
queryParams:
  - key: status
    value: PENDING
    description: 'Filter by order status (PENDING, CONFIRMED, SHIPPING, DELIVERED, CANCELLED)'
    disabled: true
  - key: page
    value: '0'
    description: Page number (0-based)
    disabled: true
  - key: size
    value: '20'
    description: Page size
    disabled: true
