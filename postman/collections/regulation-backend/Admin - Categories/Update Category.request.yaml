$kind: http-request
name: Update Category
order: 2000
method: PUT
url: '{{baseUrl}}/api/v1/admin/categories/{{categoryId}}'
pathVariables:
  - key: categoryId
    value: '{{categoryId}}'
    description: UUID of the category to update
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Laptops Updated",
      "slug": "laptops-updated",
      "description": "Updated description",
      "image_url": "https://example.com/images/laptops-new.jpg",
      "display_order": 2
    }
