$kind: http-request
name: Update Cart Item
order: 3000
method: PUT
url: '{{baseUrl}}/api/v1/cart/items/{{cartItemId}}'
pathVariables:
  - key: cartItemId
    value: '{{cartItemId}}'
    description: UUID of the cart item
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "quantity": 2
    }
