$kind: http-request
name: Set Primary Image
order: 4000
method: PATCH
url: '{{baseUrl}}/api/v1/admin/products/{{productId}}/images/{{imageId}}/primary'
pathVariables:
  - key: productId
    value: '{{productId}}'
    description: UUID of the product
  - key: imageId
    value: '{{imageId}}'
    description: UUID of the image to set as primary
