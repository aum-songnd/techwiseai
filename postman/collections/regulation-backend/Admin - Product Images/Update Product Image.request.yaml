$kind: http-request
name: Update Product Image
order: 3000
method: PUT
url: '{{baseUrl}}/api/v1/admin/products/{{productId}}/images/{{imageId}}'
pathVariables:
  - key: productId
    value: '{{productId}}'
    description: UUID of the product
  - key: imageId
    value: '{{imageId}}'
    description: UUID of the image to update
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
      description: New image file (optional)
    - key: altText
      type: text
      value: 'Updated alt text'
      description: Updated alt text (optional)
    - key: displayOrder
      type: text
      value: '1'
      description: Updated display order (optional)
