$kind: http-request
name: Get Products
order: 1000
method: GET
url: '{{baseUrl}}/api/v1/products'
queryParams:
  - key: category
    value: ''
    description: Filter by category slug (optional)
    disabled: true
  - key: featured
    value: 'true'
    description: Filter featured products (optional)
    disabled: true
  - key: hot
    value: 'true'
    description: Filter hot products (optional)
    disabled: true
  - key: page
    value: '0'
    description: Page number (0-based)
    disabled: true
  - key: size
    value: '10'
    description: Page size
    disabled: true
  - key: sort
    value: 'createdAt,desc'
    description: Sort field and direction
    disabled: true
