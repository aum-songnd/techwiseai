$kind: http-request
name: Search Products
order: 3000
method: GET
url: '{{baseUrl}}/api/v1/products/search'
queryParams:
  - key: keyword
    value: laptop
    description: Search keyword (required)
  - key: page
    value: '0'
    description: Page number (0-based)
    disabled: true
  - key: size
    value: '10'
    description: Page size
    disabled: true
