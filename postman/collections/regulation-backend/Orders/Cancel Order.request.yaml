$kind: http-request
name: Cancel Order
order: 4000
method: PATCH
url: '{{baseUrl}}/api/v1/orders/{{orderId}}/cancel'
pathVariables:
  - key: orderId
    value: '{{orderId}}'
    description: UUID of the order to cancel
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Changed my mind"
    }
