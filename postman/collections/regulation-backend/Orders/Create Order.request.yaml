$kind: http-request
name: Create Order
order: 1000
method: POST
url: '{{baseUrl}}/api/v1/orders'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "recipientName": "Nguyen Van A",
      "recipientPhone": "0912345678",
      "shippingAddress": "123 Nguyen Hue, District 1, Ho Chi Minh City",
      "note": "Please call before delivery"
    }
