$kind: collection
name: Regulation Backend API
description: |-
  API collection for the Regulation Backend — a Spring Boot e-commerce application.
  Covers Auth, Products, Categories, Cart, Favorites, Orders, Payments, and Chat endpoints.

  Base URL: {{baseUrl}}

  Authentication: Bearer JWT token. Obtain a token via POST /api/v1/auth/login,
  then set the `token` collection variable to authenticate protected endpoints.
variables:
  - key: baseUrl
    value: 'http://localhost:8080'
    description: Base URL of the running server
  - key: token
    value: ''
    description: 'JWT access token — set after login'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
